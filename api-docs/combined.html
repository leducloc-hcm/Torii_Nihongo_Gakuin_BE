<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Torii API Docs - All Services</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .tabs {
        display: flex;
        background: #1a1a1a;
        border-bottom: 1px solid #333;
        padding: 0 20px;
      }
      .tab {
        padding: 15px 25px;
        cursor: pointer;
        color: #888;
        border-bottom: 2px solid transparent;
        transition: all 0.2s;
      }
      .tab:hover {
        color: #fff;
      }
      .tab.active {
        color: #fff;
        border-bottom-color: #4a9eff;
      }
      .content {
        height: calc(100% - 51px);
        position: relative;
      }
      .api-frame {
        display: none;
        width: 100%;
        height: 100%;
        border: none;
      }
      .api-frame.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="tabs">
      <div class="tab active" data-service="learning">
        Learning Service (NestJS)
      </div>
      <div class="tab" data-service="assessment">
        Assessment Service (Spring Boot)
      </div>
    </div>
    <div class="content">
      <iframe
        id="learning"
        class="api-frame active"
        src="learning.html"
      ></iframe>
      <iframe id="assessment" class="api-frame" src="assessment.html"></iframe>
    </div>
    <script>
      const tabs = document.querySelectorAll(".tab");
      const frames = document.querySelectorAll(".api-frame");

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          const service = tab.dataset.service;

          tabs.forEach((t) => t.classList.remove("active"));
          frames.forEach((f) => f.classList.remove("active"));

          tab.classList.add("active");
          document.getElementById(service).classList.add("active");
        });
      });
    </script>
  </body>
</html>
