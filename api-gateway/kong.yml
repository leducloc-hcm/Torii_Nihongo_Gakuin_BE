      - name: graphql-route
        paths:
          - /graphql
        strip_path: false
        methods:
          - GET
          - POST
          - OPTIONS
      - name: auth-route
        paths:
          - /auth
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        plugins:
          - name: rate-limiting
            config:
              minute: 100
              hour: 1000
              policy: redis
              redis:
                host: redis
                port: 6379
                password: ""
                database: 0
          - name: request-transformer
            config:
              add:
                headers:
                  - X-Forwarded-Proto:https
      - name: folders-route
        paths:
          - /folders
        strip_path: false
        methods:
