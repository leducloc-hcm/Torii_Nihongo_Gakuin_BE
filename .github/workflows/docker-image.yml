name: CICD

on:
  push:
    branches: [aws-server]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: leducloc02122004/torii-nihongo-gakuin:latest
  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Pull image from Docker Hub
        run: sudo docker pull leducloc02122004/torii-nihongo-gakuin:latest

      - name: Delete old container if exists
        run: sudo docker rm -f torii-nihongo-gakuin_container || true

      - name: Run docker container
        run: sudo docker container run -dp 4000:4000 --name torii-nihongo-gakuin_container leducloc02122004/torii-nihongo-gakuin
